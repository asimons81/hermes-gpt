[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gpt"
version = "0.14.0"
description = "Local-dev MCP sidecar for exposing selected Hermes Agent capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "hermes-gpt contributors" }
]
dependencies = [
  "mcp[cli]>=1.28.1,<3",
  "packaging>=23",
  "uvicorn>=0.30,<1",
  "cryptography>=42",
  "pyyaml>=6.0.3,<7",
  "croniter>=2.0,<7",
  "tomli; python_version < '3.11'",
  # rm-099: both are DIRECT imports, previously resolved only transitively
  # via mcp[cli]. starlette: server.py, ui_api.py, ui_chat.py, ui_missions.py,
  # ui_ops.py, operator_live_events.py. anyio: mcp_compat.py, ui_missions.py
  # (dedicated long-poll limiter). Declared so the operator UI has an
  # explicit install contract independent of the MCP SDK's dependency pivot.
  "starlette>=0.40,<2",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-xdist>=3,<4",
  "ruff>=0.15,<0.16",
  "build",
  "twine",
  "keyring",
  # rm-138: property-based grammar invariants for the vendored cron
  # schedule parser (new direct dev dependency; no runtime impact).
  "hypothesis>=6,<7",
]

# uv syncs this PEP 735 dependency group by default (unlike extras), so
# `uv run python -m pytest -q -n 8` works in a bare checkout without
# `--extra dev` or a pre-installed venv. Keep this list identical to
# [project.optional-dependencies].dev (used by CI: `pip install -e ".[dev]"`).
[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist>=3,<4",
  "ruff>=0.15,<0.16",
  "build",
  "twine",
  "keyring",
  "hypothesis>=6,<7",
]

[project.scripts]
hermes-gpt = "server:main"
hermes-gpt-fabric-peer = "operator_fabric_g4c:peer_main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "server",
  "oauth_auth",
  "operator_policy",
  "operator_cron",
  "operator_skills",
  "operator_skill_resolution",
  "operator_profile_scope",
  "operator_config",
  "operator_workspace",
  "operator_export",
  "operator_fleet",
  "fabric_artifacts",
  "fabric_write_guard",
  "operator_fabric",
  "operator_fabric_control",
  "operator_fabric_router",
  "operator_fabric_g4c",
  "operator_fabric_view",
  "operator_diagnostics",
  "operator_codex",
  "operator_session",
  "operator_mission",
  "operator_mission_runtime",
  "operator_mission_plan",
  "operator_mission_ledger",
  "operator_mission_budget",
  "operator_capability_manifest",
  "operator_placement",
  "operator_failure_semantics",
  "operator_controller",
  "operator_autopilot",
  "operator_campaign_compiler",
  "operator_campaign_controller",
  "operator_campaign_lane",
  "operator_work_class",
  "operator_contract",
  "operator_delegations",
  "operator_job_supervisor",
  "operator_runners",
  "operator_hermes_agent_runner",
  "runner_confinement",
  "operator_review",
  "operator_events",
  "operator_live_events",
  "operator_oauth",
  "token_store",
  "operator_swarm",
  "operator_swarm_workflows",
  "operator_recovery",
  "operator_finance",
