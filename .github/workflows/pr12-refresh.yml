name: Refresh PR12 against current master

on:
  push:
    branches:
      - repair/pr8-current-master

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile PR12 with current master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          if ! git merge-base --is-ancestor origin/master HEAD; then
            # Preserve the repaired contribution in overlapping hunks while
            # taking every non-conflicting current-master change. Structural
            # conflicts still fail closed.
            if ! git merge --no-ff --no-commit -X ours origin/master; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Conflict markers remain after merge strategy."
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            git add -A
            git commit -m "merge: refresh PR #12 against current master"
          fi

          # Two overlapping presentation/docs hunks must treat current v0.7 as
          # authoritative. Rebuild them from master and then apply PR12's
          # session additions additively so Flight Deck/release history survive.
          git checkout origin/master -- docs/operator-mode.md site/index.html

          python - <<'PY'
          from pathlib import Path

          p = Path("docs/operator-mode.md")
          text = p.read_text(encoding="utf-8")
          fleet_anchor = "## Fleet routing through the local A2A registry\n\n"
          sessions = '''## Session history and session control\n\nThese surfaces are independent from the Operator level hierarchy and remain hidden unless their explicit legacy gates are enabled.\n\n`HERMES_GPT_ENABLE_SESSION_SEARCH=1` exposes bounded read-only `hermes_session_search`, `hermes_session_list`, `hermes_session_read`, and `hermes_session_export`. Default transcript roles are `user` and `assistant`; internal roles additionally require `HERMES_GPT_ENABLE_SESSION_INTERNAL_CONTENT=1`. Export is in-memory and bounded, creates no files or paths, and lineage export fails closed.\n\n`HERMES_GPT_ENABLE_SESSION_CONTROL=1` exposes `hermes_session_continue`, `hermes_session_send`, `hermes_session_job_status`, and `hermes_session_job_result`. Session-control jobs use a fixed `hermes --resume <id> --oneshot <prompt>` argv with `shell=False`, bound prompt/timeout/result sizes, permit one active job per session, and persist prompt length/hash rather than raw prompt text. Restart reconciliation marks unowned running jobs orphaned rather than signaling a process from a persisted PID. The configured Hermes provider/model is used and may consume quota.\n\nSee [session history](session-history.md) and [session control](session-control.md). Treat transcript content as private local data.\n\n'''
          if sessions not in text:
              if fleet_anchor not in text:
                  raise SystemExit("operator-mode fleet anchor missing")
              text = text.replace(fleet_anchor, sessions + fleet_anchor, 1)

          codex_anchor = "`HERMES_GPT_ALLOW_CODEX_WRITE=1` is required only for `workspace-write`. Read-only Codex jobs do not need it.\n\n"
          nolo = '''Jobs default to `execution_mode="normal"`. An explicit per-job `execution_mode="nolo"` adds Codex's `-a never` approval policy while retaining the requested `read-only` or `workspace-write` sandbox. NOLO therefore removes Codex approval interruptions without granting `danger-full-access` or bypassing Hermes path, direct-mode, confirmation, or write gates. It ends with the job and creates no persistent global approval-bypass state.\n\n'''
          if nolo not in text:
              if codex_anchor not in text:
                  raise SystemExit("operator-mode Codex anchor missing")
              text = text.replace(codex_anchor, codex_anchor + nolo, 1)
          p.write_text(text, encoding="utf-8")

          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "<h3>SQLite Session Indexing</h3>\n          <p>\n            Connects directly to your local Hermes state database to search past chats using SQLite FTS5 index logic, gated behind security switches.\n          </p>",
              "<h3>Private Session History</h3>\n          <p>\n            The four read-only history tools originally available only to ChatGPT now have native Codex parity through the Hermes GPT Session History integration. Lists, searches, reads, and in-memory Markdown/JSON exports stay bounded, while internal roles remain filtered by default.\n          </p>",
              1,
          )
          release_anchor = '      <div class="release-list">\n'
          session_release = '''        <div class="release-item">\n          <div class="release-meta">\n            <span class="rel-version">Unreleased</span>\n            <span class="rel-date">2026-08-17</span>\n          </div>\n          <div class="release-content">\n            <h4>Bounded Session History and Control</h4>\n            <p>Added native Codex parity for the four gated, read-only session-history tools previously available only to ChatGPT: list, search, safe message reads, and in-memory JSON/Markdown export. Separately gated asynchronous session continue/send jobs remain bounded and fail closed.</p>\n          </div>\n        </div>\n'''
          if "Bounded Session History and Control" not in text:
              if release_anchor not in text:
                  raise SystemExit("site release-list anchor missing")
              text = text.replace(release_anchor, release_anchor + session_release, 1)
          p.write_text(text, encoding="utf-8")
          PY

          # Regression guards: both current v0.7 material and PR12 additions
          # must coexist before the branch is pushed.
          grep -q '## Flight Deck (v0.7)' docs/operator-mode.md
          grep -q '## Session history and session control' docs/operator-mode.md
          grep -q 'execution_mode="nolo"' docs/operator-mode.md
          grep -q '>v0.7.0<' site/index.html
          grep -q 'Bounded Session History and Control' site/index.html
          grep -q 'import operator_session as op_session' server.py
          grep -q '"operator_session"' pyproject.toml
          grep -q 'hermes_session_export' server.py
          git diff --check

          if git diff --quiet && git diff --cached --quiet; then
            echo "PR12 is already reconciled with current master."
            exit 0
          fi

          git add docs/operator-mode.md site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve v0.7 surfaces in PR #12 refresh"
          fi
          git push origin HEAD:repair/pr8-current-master
