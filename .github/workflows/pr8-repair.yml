name: PR8 merge repair

on:
  push:
    branches:
      - repair/pr8-current-master

permissions:
  contents: write

jobs:
  merge-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current master and resolve known conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          # A push made by this workflow triggers it again. Exit cleanly once
          # current master is already in the repair branch history.
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "Current master is already merged."
            exit 0
          fi

          git merge --no-ff --no-commit origin/master || true

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          echo "Conflicts:"
          printf '%s\n' "$conflicts"

          expected="CHANGELOG.md README.md RELEASE_CHECKLIST.md docs/codex.md docs/operator-mode.md pyproject.toml server.py"
          for f in $conflicts; do
            case " $expected " in
              *" $f "*) ;;
              *) echo "Unexpected merge conflict: $f"; exit 1 ;;
            esac
          done

          # Current v0.6 documentation is authoritative. Start from master for
          # these files, then add the PR's new session/NOLO documentation below.
          git checkout --theirs -- README.md RELEASE_CHECKLIST.md docs/codex.md docs/operator-mode.md

          # The remaining conflicts are additive: keep both the session work
          # and the v0.6 modules/imports/changelog entries.
          git checkout --conflict=merge -- CHANGELOG.md pyproject.toml server.py

          python - <<'PY'
          from pathlib import Path
          import re

          def join_conflicts(path: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n?",
                  re.S,
              )
              while pattern.search(text):
                  text = pattern.sub(lambda m: m.group(1) + m.group(2), text)
              if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
                  raise SystemExit(f"Unresolved conflict marker in {path}")
              p.write_text(text, encoding="utf-8")

          for path in ("CHANGELOG.md", "pyproject.toml", "server.py"):
              join_conflicts(path)

          # README: add the independent session gates and a current v0.6-style
          # description of session history/control, plus NOLO delegated mode.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "| Session search | `HERMES_GPT_ENABLE_SESSION_SEARCH=1` | hidden |\n",
              "| Session search/history | `HERMES_GPT_ENABLE_SESSION_SEARCH=1` | hidden |\n"
              "| Session control | `HERMES_GPT_ENABLE_SESSION_CONTROL=1` | hidden |\n",
          )
          anchor = "For new automation and maintenance work, prefer Operator Mode instead of enabling broad legacy write gates.\n\n"
          session_section = '''## Session history and control\n\nSession history and session control are independent, opt-in surfaces.\n\nWith `HERMES_GPT_ENABLE_SESSION_SEARCH=1`, Hermes GPT exposes four bounded read-only history tools: `hermes_session_search`, `hermes_session_list`, `hermes_session_read`, and `hermes_session_export`. The default transcript roles are `user` and `assistant`; `system`, `tool`, and `function` content additionally requires `HERMES_GPT_ENABLE_SESSION_INTERNAL_CONTENT=1`. Export stays in memory, is size/message bounded, creates no files or paths, and lineage export fails closed.\n\nWith `HERMES_GPT_ENABLE_SESSION_CONTROL=1`, Hermes GPT exposes `hermes_session_continue`, `hermes_session_send`, `hermes_session_job_status`, and `hermes_session_job_result`. Control jobs are bounded, use fixed argv with `shell=False`, allow only one active job per session, persist prompt length/hash rather than raw prompts, and return bounded redacted results. A server restart fails closed by marking unowned running jobs orphaned rather than signaling a persisted PID.\n\nSee [session history](docs/session-history.md) and [session control](docs/session-control.md). Treat transcript data as private local data.\n\n'''
          if session_section not in text:
              text = text.replace(anchor, anchor + session_section)
          codex_anchor = "`HERMES_GPT_ALLOW_CODEX_WRITE=1` is required only for `workspace-write` jobs.\n\n"
          nolo = '''Delegated Codex jobs default to `execution_mode="normal"`. Trusted clients may opt into job-scoped `execution_mode="nolo"`, which adds Codex's `-a never` approval policy while retaining the requested `read-only` or `workspace-write` sandbox. NOLO does not enable `danger-full-access`, does not bypass Hermes workspace/confirmation gates, and does not create persistent global approval-bypass state.\n\n'''
          if nolo not in text:
              text = text.replace(codex_anchor, codex_anchor + nolo)
          p.write_text(text, encoding="utf-8")

          # Codex guide: preserve v0.6's two-workflow model, add the separate
          # session-history integration and clarify that NOLO changes approvals,
          # not sandbox containment.
          p = Path("docs/codex.md")
          text = p.read_text(encoding="utf-8")
          operator_anchor = "The `operator` toolset adds curated namespaced aliases for Operator diagnostics, audit, cron, skills, non-secret config/environment, and gateway operations. It intentionally excludes broad workspace, raw git/command, and Owner file-write surfaces.\n\n"
          history = '''### Optional session-history integration\n\nSession history is intentionally separate from the curated `core` and `operator` toolsets. The separately installed **Hermes GPT Session History** integration exposes native read-only `hermes_session_list`, `hermes_session_search`, `hermes_session_read`, and `hermes_session_export` tools to Codex while the backing Hermes GPT server still requires `HERMES_GPT_ENABLE_SESSION_SEARCH=1`. These tools do not create files. Internal `system`, `tool`, and `function` content additionally requires `HERMES_GPT_ENABLE_SESSION_INTERNAL_CONTENT=1`; keep those roles and lineage disabled during routine inspection. See [session history](session-history.md).\n\n'''
          if history not in text:
              text = text.replace(operator_anchor, operator_anchor + history)
          read_anchor = "Read-only jobs do not need the write gate.\n\n"
          nolo = '''Delegated jobs default to `execution_mode="normal"`. An explicit job-scoped `execution_mode="nolo"` adds Codex's top-level `-a never` approval policy while preserving the requested `read-only` or `workspace-write` sandbox. `workspace-write` still requires `HERMES_GPT_ALLOW_CODEX_WRITE=1`, and Hermes still enforces the approved work directory, direct mode, `confirm=true`, and `dry_run=false`. NOLO expires with the job and is not a persistent global bypass.\n\n'''
          if nolo not in text:
              text = text.replace(read_anchor, read_anchor + nolo)
          text = text.replace(
              "Danger-full-access, approval bypasses, arbitrary command injection, arbitrary executable arguments, and arbitrary extra-directory grants are unsupported.",
              "`danger-full-access`, sandbox bypasses, arbitrary command injection, arbitrary executable arguments, and arbitrary extra-directory grants are unsupported. The supported job-scoped `nolo` mode changes Codex's approval policy only; it does not disable the selected sandbox or Hermes policy checks.",
          )
          p.write_text(text, encoding="utf-8")

          # Operator guide: document the independent history/control gates and
          # add NOLO semantics to the existing delegated Codex section.
          p = Path("docs/operator-mode.md")
          text = p.read_text(encoding="utf-8")
          fleet_anchor = "## Fleet routing through the local A2A registry\n\n"
          sessions = '''## Session history and session control\n\nThese surfaces are independent from the Operator level hierarchy and remain hidden unless their explicit legacy gates are enabled.\n\n`HERMES_GPT_ENABLE_SESSION_SEARCH=1` exposes bounded read-only `hermes_session_search`, `hermes_session_list`, `hermes_session_read`, and `hermes_session_export`. Default transcript roles are `user` and `assistant`; internal roles additionally require `HERMES_GPT_ENABLE_SESSION_INTERNAL_CONTENT=1`. Export is in-memory and bounded, creates no files or paths, and lineage export fails closed.\n\n`HERMES_GPT_ENABLE_SESSION_CONTROL=1` exposes `hermes_session_continue`, `hermes_session_send`, `hermes_session_job_status`, and `hermes_session_job_result`. Session-control jobs use a fixed `hermes --resume <id> --oneshot <prompt>` argv with `shell=False`, bound prompt/timeout/result sizes, permit one active job per session, and persist prompt length/hash rather than raw prompt text. Restart reconciliation marks unowned running jobs orphaned rather than signaling a process from a persisted PID. The configured Hermes provider/model is used and may consume quota.\n\nSee [session history](session-history.md) and [session control](session-control.md). Treat transcript content as private local data.\n\n'''
          if sessions not in text:
              text = text.replace(fleet_anchor, sessions + fleet_anchor)
          codex_anchor = "`HERMES_GPT_ALLOW_CODEX_WRITE=1` is required only for `workspace-write`. Read-only Codex jobs do not need it.\n\n"
          nolo = '''Jobs default to `execution_mode="normal"`. An explicit per-job `execution_mode="nolo"` adds Codex's `-a never` approval policy while retaining the requested `read-only` or `workspace-write` sandbox. NOLO therefore removes Codex approval interruptions without granting `danger-full-access` or bypassing Hermes path, direct-mode, confirmation, or write gates. It ends with the job and creates no persistent global approval-bypass state.\n\n'''
          if nolo not in text:
              text = text.replace(codex_anchor, codex_anchor + nolo)
          p.write_text(text, encoding="utf-8")

          # Release checklist: retain v0.6 release process and extend it with the
          # new session module/docs/security contracts.
          p = Path("RELEASE_CHECKLIST.md")
          text = p.read_text(encoding="utf-8")
          test_anchor = "- `python -m pytest test_operator_codex.py`\n  - Codex executable resolution, runner gates, bounded argv, redaction, and retention behavior must be green.\n"
          session_tests = "- `python -m pytest test_operator_session.py`\n  - Session-control gating, prompt non-persistence, fixed argv, concurrency bounds, timeout/result bounds, redaction, and restart orphan reconciliation must be green.\n"
          if session_tests not in text:
              text = text.replace(test_anchor, test_anchor + session_tests)
          text = text.replace(
              "  - `docs/codex.md`\n",
              "  - `docs/codex.md`\n  - `docs/session-history.md`\n  - `docs/session-control.md`\n",
              1,
          )
          text = text.replace(
              "- Confirm default tools exclude write, patch, terminal, and session search unless their explicit gates are enabled.\n",
              "- Confirm default tools exclude write, patch, terminal, session search/history, and session control unless their explicit gates are enabled.\n"
              "- With `HERMES_GPT_ENABLE_SESSION_SEARCH=1`, confirm exactly `hermes_session_search`, `hermes_session_list`, `hermes_session_read`, and `hermes_session_export` are exposed for session history.\n"
              "- Confirm session history defaults to `user`/`assistant`; internal roles require `HERMES_GPT_ENABLE_SESSION_INTERNAL_CONTENT=1`.\n"
              "- Confirm session export stays in memory, enforces message/response bounds, creates no files or paths, and fails closed for lineage.\n"
              "- Confirm unavailable session FTS/search reports an unavailable limitation rather than falsely reporting no matches.\n"
              "- Confirm session-control jobs use fixed argv with `shell=False`, persist no raw prompt, enforce concurrency/timeout/result bounds, redact results, and fail closed on restart reconciliation.\n",
          )
          # Add session docs to the documentation-consistency list if needed.
          doc_anchor = "- `docs/codex.md`\n- `docs/windows-chatgpt-codex.md`\n"
          if "- `docs/session-history.md`\n" not in text[text.find("## 9. Documentation consistency"):]:
              text = text.replace(doc_anchor, "- `docs/codex.md`\n- `docs/session-history.md`\n- `docs/session-control.md`\n- `docs/windows-chatgpt-codex.md`\n")
          p.write_text(text, encoding="utf-8")
          PY

          # Verify the expected additive code/doc package entries survived.
          grep -q '"operator_session"' pyproject.toml
          grep -q '"operator_mission"' pyproject.toml
          grep -q 'import operator_session as op_session' server.py
          grep -q 'import operator_mission as op_mission' server.py
          grep -q 'docs/session-history.md' pyproject.toml
          grep -q 'docs/session-control.md' pyproject.toml
          grep -q 'HERMES_GPT_ENABLE_SESSION_CONTROL' README.md
          grep -q 'execution_mode="nolo"' docs/codex.md

          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' CHANGELOG.md README.md RELEASE_CHECKLIST.md docs/codex.md docs/operator-mode.md pyproject.toml server.py; then
            echo "Conflict markers remain."
            exit 1
          fi

          git add CHANGELOG.md README.md RELEASE_CHECKLIST.md docs/codex.md docs/operator-mode.md pyproject.toml server.py
          git add site/index.html test_server.py || true
          git add -u

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: resolve PR #8 against current master"
            git push origin HEAD:repair/pr8-current-master
          else
            echo "Expected an in-progress merge, but MERGE_HEAD is missing."
            exit 1
          fi
