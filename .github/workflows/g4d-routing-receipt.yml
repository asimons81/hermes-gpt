name: G4-D Routing Receipt Patch

on:
  push:
    branches:
      - v0.8-fabric-g4d-flight-deck

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8-fabric-g4d-flight-deck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persist bounded G4-D router explanation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('operator_fabric_router.py')
          text = path.read_text()
          old = '''        "placed_contract_sha256": placed_sha256,
        "selected": decision["selected"],
        "created_at": datetime.now(timezone.utc).isoformat(),
'''
          new = '''        "placed_contract_sha256": placed_sha256,
        "mode": "auto",
        "requirements": decision.get("requirements") or {},
        "preferences": decision.get("preferences") or {},
        "selected": decision["selected"],
        "candidates": decision.get("candidates") or [],
        "created_at": datetime.now(timezone.utc).isoformat(),
'''
          if old not in text:
              raise SystemExit('router receipt block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile operator_fabric_router.py operator_fabric_view.py ui_fabric.py
          rm .github/workflows/g4d-routing-receipt.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(fabric): persist routing explanations for Flight Deck'
          git push origin HEAD:v0.8-fabric-g4d-flight-deck
