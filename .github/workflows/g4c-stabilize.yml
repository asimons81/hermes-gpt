name: G4-C Stabilize

on:
  push:
    branches:
      - v0.8-fabric-g4c-artifacts-reconciliation

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply consolidated G4-C stabilization fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('test_operator_fabric_g4c.py')
          test_text = test_path.read_text()
          old = 'svc._release_claim(first_row, proof="stale-release")'
          new = 'svc.claims.release(first_row, proof="stale-release")'
          if old not in test_text:
              raise SystemExit('expected stale release assertion not found')
          test_path.write_text(test_text.replace(old, new, 1))

          pyproject = Path('pyproject.toml')
          project_text = pyproject.read_text()
          marker = '  "operator_fabric",\n'
          additions = '  "fabric_artifacts",\n  "fabric_write_guard",\n'
          if '  "fabric_artifacts",\n' not in project_text:
              if marker not in project_text:
                  raise SystemExit('pyproject Fabric module marker not found')
              project_text = project_text.replace(marker, additions + marker, 1)
          pyproject.write_text(project_text)

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          compile_marker = '          operator_fabric.py\n'
          compile_additions = '          fabric_artifacts.py\n          fabric_write_guard.py\n'
          if '          fabric_artifacts.py\n' not in ci_text:
              if compile_marker not in ci_text:
                  raise SystemExit('CI compile marker not found')
              ci_text = ci_text.replace(compile_marker, compile_additions + compile_marker, 1)
          lint_marker = '          operator_fabric.py operator_fabric_control.py operator_fabric_router.py operator_fabric_g4c.py\n'
          lint_replacement = '          fabric_artifacts.py fabric_write_guard.py\n          operator_fabric.py operator_fabric_control.py operator_fabric_router.py operator_fabric_g4c.py\n'
          if '          fabric_artifacts.py fabric_write_guard.py\n' not in ci_text:
              if lint_marker not in ci_text:
                  raise SystemExit('CI lint marker not found')
              ci_text = ci_text.replace(lint_marker, lint_replacement, 1)
          ci.write_text(ci_text)
          PY
          python -m ruff check --fix \
            operator_fabric_g4c.py test_operator_fabric_g4c.py \
            fabric_artifacts.py fabric_write_guard.py
      - name: Verify focused G4-C matrix
        run: >-
          python -m pytest -q
          test_operator_fabric.py
          test_operator_fabric_adversarial.py
          test_operator_fabric_control.py
          test_operator_fabric_router.py
          test_operator_fabric_g4c.py
      - name: Verify lint and compile
        shell: bash
        run: |
          python -m ruff check \
            operator_fabric_g4c.py test_operator_fabric_g4c.py \
            fabric_artifacts.py fabric_write_guard.py
          python -m py_compile \
            operator_fabric_g4c.py fabric_artifacts.py fabric_write_guard.py
          git diff --check
      - name: Commit consolidated stabilization
        shell: bash
        run: |
          rm .github/workflows/g4c-stabilize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(fabric): stabilize G4-C gate'
          git push origin HEAD:v0.8-fabric-g4c-artifacts-reconciliation
