name: Issue 14 final documentation patch

on:
  push:
    branches:
      - feat/binary-file-export

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/binary-file-export
          fetch-depth: 0
      - name: Patch exact documentation markers
        shell: python
        run: |
          from pathlib import Path

          def replace_once(filename, old, new):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"guard failed for {filename}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "| `workspace` | scoped workspace writes/tests, gateway restart, Codex jobs, contract/swarm dispatch |",
              "| `workspace` | scoped workspace reads/writes/tests, bounded binary export, gateway restart, Codex jobs, contract/swarm dispatch |",
          )
          replace_once(
              "README.md",
              "See [docs/operator-mode.md](docs/operator-mode.md) for the complete policy model and exact gates.\n",
              "`hermes_export_file(path)` is a workspace-authorized, read-only transfer surface for existing local binary files. It requires a non-empty `HERMES_GPT_OPERATOR_ALLOWED_PATHS`, preserves denied secret paths, defaults to a 4 MiB limit with a 16 MiB hard ceiling, and returns bytes as an MCP embedded resource rather than base64 text. See [Binary file export](docs/file-export.md) for the complete limits and client-rendering contract.\n\nSee [docs/operator-mode.md](docs/operator-mode.md) for the complete policy model and exact gates.\n",
          )
          replace_once(
              "docs/operator-mode.md",
              "| `workspace` | scoped workspace read/write/test, gateway restart, Codex jobs, contract/swarm dispatch |",
              "| `workspace` | scoped workspace read/write/test, bounded binary export, gateway restart, Codex jobs, contract/swarm dispatch |",
          )
          replace_once(
              "docs/operator-mode.md",
              "## Work Contracts\n",
              "## Binary file export\n\n"
              "`hermes_export_file(path)` is a read-only raw-byte transfer surface gated at Operator `workspace` level. It requires a non-empty `HERMES_GPT_OPERATOR_ALLOWED_PATHS`, resolves paths before authorization so symlink escapes are refused, preserves all denied secret/credential paths even in Owner Mode, enforces a 4 MiB default and 16 MiB hard maximum, and supports an optional `HERMES_GPT_EXPORT_ALLOWED_EXTENSIONS` suffix allowlist. Successful bytes are returned as `EmbeddedResource(BlobResourceContents)` with safe metadata; client download/attachment rendering is client-controlled. See [Binary file export](file-export.md).\n\n"
              "## Work Contracts\n",
          )
          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n\n",
              "## Unreleased\n\n- Added `hermes_export_file`, a workspace-authorized MCP-native binary export surface with mandatory allowed-path confinement, denied-secret-path enforcement, symlink escape refusal, a 4 MiB default / 16 MiB hard size cap, optional extension allowlisting, safe audit metadata, and no base64 text fallback. Client attachment rendering remains client-controlled.\n",
          )
      - name: Verify and commit
        run: |
          git diff --check
          grep -n "hermes_export_file" README.md docs/operator-mode.md CHANGELOG.md
          rm .github/workflows/issue14-final-doc-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/operator-mode.md CHANGELOG.md .github/workflows/issue14-final-doc-patch.yml
          git commit -m "docs: surface binary export in operational docs"
          git push origin HEAD:feat/binary-file-export
