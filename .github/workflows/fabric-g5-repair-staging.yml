name: Fabric G5 HIGH repair staging

on:
  push:
    branches:
      - v0.8-fabric-g5-repair-staging

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8-fabric-g5-repair-staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply fail-closed HIGH-1 and HIGH-2 repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          fabric = Path("operator_fabric.py")
          text = fabric.read_text()
          needle = '''def _attempt_id(dispatch_id: str, sequence: int = 1) -> str:\n    return "faba-" + hashlib.sha256(f"{dispatch_id}:{sequence}".encode()).hexdigest()[:32]\n\n\ndef _auth_object(value: Any) -> dict[str, Any]:\n'''
          replacement = '''def _attempt_id(dispatch_id: str, sequence: int = 1) -> str:\n    return "faba-" + hashlib.sha256(f"{dispatch_id}:{sequence}".encode()).hexdigest()[:32]\n\n\ndef _contract_profile_scope(contract: dict[str, Any]) -> tuple[str, tuple[str, ...]]:\n    """Fail closed if Fabric placement would widen Work Contract profile scope."""\n    scope = contract.get("allowed_scope")\n    if not isinstance(scope, dict):\n        raise FabricError(\n            "FABRIC_AUTHORITY_DENIED",\n            "contract allowed_scope must be an object",\n        )\n    profiles = tuple(\n        _bounded_strings(\n            scope.get("profiles"),\n            field="contract.allowed_scope.profiles",\n            maximum=16,\n            item_max=64,\n        )\n    )\n    if not profiles or any(not _PROFILE_RE.fullmatch(profile) for profile in profiles):\n        raise FabricError(\n            "FABRIC_AUTHORITY_DENIED",\n            "contract profile scope is invalid",\n        )\n    assigned_profile = _bounded_string(\n        contract.get("assigned_profile"),\n        field="contract.assigned_profile",\n        pattern=_PROFILE_RE,\n    )\n    if assigned_profile not in profiles:\n        raise FabricError(\n            "FABRIC_AUTHORITY_DENIED",\n            "assigned profile is outside the Work Contract profile scope",\n        )\n    return assigned_profile, profiles\n\n\ndef _contract_forbidden_actions_present(contract: dict[str, Any]) -> bool:\n    """Return whether the contract declares checks Fabric v1 cannot yet prove."""\n    forbidden = contract.get("forbidden_actions", [])\n    if not isinstance(forbidden, list) or len(forbidden) > 32:\n        raise FabricError(\n            "FABRIC_SCHEMA_INVALID",\n            "contract forbidden_actions must be a bounded list",\n        )\n    return bool(forbidden)\n\n\ndef _auth_object(value: Any) -> dict[str, Any]:\n'''
          if text.count(needle) != 1:
              raise SystemExit("operator_fabric helper insertion point changed")
          text = text.replace(needle, replacement, 1)

          needle = '''        node = self._node(node_name)\n        if contract.get("assigned_agent") != node.name:\n'''
          replacement = '''        node = self._node(node_name)\n        assigned_profile, _profile_scope = _contract_profile_scope(contract)\n        if _contract_forbidden_actions_present(contract):\n            raise FabricError(\n                "FABRIC_EVIDENCE_POLICY_INVALID",\n                "verified Fabric cannot prove non-empty forbidden-action checks",\n            )\n        if contract.get("assigned_agent") != node.name:\n'''
          if text.count(needle) != 1:
              raise SystemExit("operator_fabric dispatch insertion point changed")
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '''        if contract.get("assigned_profile") not in node.allowed_profiles:\n''',
              '''        if assigned_profile not in node.allowed_profiles:\n''',
              1,
          )
          fabric.write_text(text)

          contract = Path("operator_contract.py")
          text = contract.read_text()
          needle = '''    if signals:\n        detail = "; ".join(f"{s['action']} ({s['class']}) via {s['tool']}" for s in signals[:5])\n        return {"kind": "forbidden", "status": "FAIL", "detail": f"forbidden action detected: {detail}", "evidence": signals[:10]}\n    return {"kind": "forbidden", "status": "PASS", "detail": "no forbidden actions detected in audit/artifacts"}\n'''
          replacement = '''    if signals:\n        detail = "; ".join(f"{s['action']} ({s['class']}) via {s['tool']}" for s in signals[:5])\n        return {"kind": "forbidden", "status": "FAIL", "detail": f"forbidden action detected: {detail}", "evidence": signals[:10]}\n\n    # Fabric v1 admits bounded remote run-state evidence but does not admit a\n    # coordinator-verifiable forbidden-action audit trail. New dispatches with\n    # non-empty forbidden_actions are rejected at the Fabric boundary; this\n    # guard keeps historical admitted Fabric runs from being certified merely\n    # because no coordinator-local violation signal exists. Absence is not proof.\n    try:\n        fabric_backend = op_runners.get_backend("fabric")\n        fabric_runs = fabric_backend.observed_runs(task_id, hermes_root=hermes_root)\n    except (LookupError, OSError, RuntimeError, TypeError, ValueError):\n        fabric_runs = []\n    if any(\n        isinstance(run, dict)\n        and (\n            run.get("backend") == "fabric"\n            or str(run.get("scope") or "").startswith("fabric:")\n        )\n        for run in fabric_runs\n    ):\n        return {\n            "kind": "forbidden",\n            "status": "UNVERIFIED",\n            "detail": "remote Fabric run has no coordinator-verifiable forbidden-action evidence",\n        }\n\n    return {"kind": "forbidden", "status": "PASS", "detail": "no forbidden actions detected in audit/artifacts"}\n'''
          if text.count(needle) != 1:
              raise SystemExit("operator_contract forbidden insertion point changed")
          contract.write_text(text.replace(needle, replacement, 1))

          tests = Path("test_operator_fabric_g5_review_repairs.py")
          tests.write_text('''from __future__ import annotations\n\nimport pytest\n\nimport operator_contract as op_contract\nimport operator_fabric as fabric\nfrom test_operator_fabric import contract, coordinator, service\n\n\ndef test_fabric_rejects_assigned_profile_outside_work_contract_scope(tmp_path, monkeypatch):\n    svc = service(tmp_path, monkeypatch)\n    coord = coordinator(tmp_path, svc)\n    value = contract(tmp_path)\n    value["allowed_scope"]["profiles"] = ["qa"]\n\n    with pytest.raises(fabric.FabricError) as exc:\n        coord.dispatch(value, dry_run=True, confirm=False, timeout=10)\n\n    assert exc.value.code == "FABRIC_AUTHORITY_DENIED"\n    assert "outside the Work Contract profile scope" in str(exc.value)\n\n\ndef test_fabric_rejects_forbidden_action_contract_before_remote_dispatch(tmp_path, monkeypatch):\n    counter = {"count": 0}\n    svc = service(tmp_path, monkeypatch, dispatch_counter=counter)\n    coord = coordinator(tmp_path, svc)\n    value = contract(tmp_path)\n    value["forbidden_actions"] = [\n        {"action": "public_publish", "reason": "must remain private", "class": "HIGH"}\n    ]\n\n    with pytest.raises(fabric.FabricError) as exc:\n        coord.dispatch(value, dry_run=False, confirm=True, timeout=10)\n\n    assert exc.value.code == "FABRIC_EVIDENCE_POLICY_INVALID"\n    assert counter["count"] == 0\n\n\ndef test_historical_fabric_run_cannot_self_certify_forbidden_action_absence(\n    tmp_path, monkeypatch\n):\n    value = contract(tmp_path)\n    value["forbidden_actions"] = [\n        {"action": "public_publish", "reason": "must remain private", "class": "HIGH"}\n    ]\n    monkeypatch.setattr(op_contract, "_observed_audit", lambda: [])\n\n    class HistoricalFabricBackend:\n        def observed_runs(self, task_id, *, hermes_root=None):\n            return [\n                {\n                    "task_id": task_id,\n                    "backend": "fabric",\n                    "scope": "fabric:node-a",\n                    "status": "completed",\n                    "outcome": "completed",\n                }\n            ]\n\n    original_get_backend = op_contract.op_runners.get_backend\n    monkeypatch.setattr(\n        op_contract.op_runners,\n        "get_backend",\n        lambda name: HistoricalFabricBackend()\n        if name == "fabric"\n        else original_get_backend(name),\n    )\n\n    result = op_contract._check_forbidden(value, tmp_path)\n\n    assert result["status"] == "UNVERIFIED"\n    assert "no coordinator-verifiable forbidden-action evidence" in result["detail"]\n''')
          PY
      - name: Run blocking-finding regressions
        run: python -m pytest -q test_operator_fabric_g5_review_repairs.py
      - name: Run focused Fabric and contract suites
        run: >-
          python -m pytest -q
          test_operator_contract.py
          test_operator_fabric.py
          test_operator_fabric_adversarial.py
          test_operator_fabric_router.py
          test_operator_fabric_g4c.py
          test_operator_fabric_integration.py
          test_operator_swarm.py
      - name: Lint repaired surfaces
        run: python -m ruff check operator_fabric.py operator_contract.py test_operator_fabric_g5_review_repairs.py
      - name: Compile repaired runtime
        run: python -m py_compile operator_fabric.py operator_contract.py operator_fabric_g4c.py operator_fabric_router.py operator_swarm.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified repair and remove staging helper
        shell: bash
        run: |
          rm .github/workflows/fabric-g5-repair-staging.yml
          git config user.name "Hermes GPT repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(v0.8): close independent G5 HIGH findings"
          git push origin HEAD:v0.8-fabric-g5-repair-staging
