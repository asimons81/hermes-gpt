name: Issue 14 registry patch

on:
  push:
    branches:
      - feat/binary-file-export

permissions:
  contents: write

jobs:
  patch-server:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/binary-file-export
          fetch-depth: 0

      - name: Apply exact guarded server patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "import operator_workspace as op_workspace\n",
                  "import operator_workspace as op_workspace\nimport operator_export as op_export\n",
              ),
              (
                  "from mcp.types import ToolAnnotations\n",
                  "from mcp.types import CallToolResult, ToolAnnotations\n",
              ),
              (
                  "def hermes_workspace_read(path: str, offset: int = 1, limit: int = 500) -> str:\n"
                  "    return op_workspace.hermes_workspace_read(path=path, offset=offset, limit=limit)\n\n\n"
                  "def hermes_workspace_patch(\n",
                  "def hermes_workspace_read(path: str, offset: int = 1, limit: int = 500) -> str:\n"
                  "    return op_workspace.hermes_workspace_read(path=path, offset=offset, limit=limit)\n\n\n"
                  "def hermes_export_file(path: str) -> CallToolResult:\n"
                  "    return op_export.hermes_export_file(path=path)\n\n\n"
                  "def hermes_workspace_patch(\n",
              ),
              (
                  "            \"hermes_gateway_restart\",\n"
                  "            \"hermes_workspace_read\",\n"
                  "            \"hermes_workspace_patch\",\n",
                  "            \"hermes_gateway_restart\",\n"
                  "            \"hermes_workspace_read\",\n"
                  "            \"hermes_export_file\",\n"
                  "            \"hermes_workspace_patch\",\n",
              ),
              (
                  "    server.add_tool(hermes_gateway_restart, meta=tool_meta())\n"
                  "    server.add_tool(hermes_workspace_read, meta=tool_meta())\n"
                  "    server.add_tool(hermes_workspace_patch, meta=tool_meta())\n",
                  "    server.add_tool(hermes_gateway_restart, meta=tool_meta())\n"
                  "    server.add_tool(hermes_workspace_read, meta=tool_meta())\n"
                  "    server.add_tool(\n"
                  "        hermes_export_file,\n"
                  "        meta=tool_meta(),\n"
                  "        annotations=ToolAnnotations(\n"
                  "            title=\"Export an authorized local file as an MCP embedded resource\",\n"
                  "            readOnlyHint=True,\n"
                  "        ),\n"
                  "    )\n"
                  "    server.add_tool(hermes_workspace_patch, meta=tool_meta())\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected exactly one marker, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify changed surface
        run: |
          python -m py_compile server.py operator_export.py
          git diff --check
          git diff -- server.py

      - name: Commit guarded patch and remove one-shot workflow
        run: |
          rm .github/workflows/issue14-register-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py .github/workflows/issue14-register-export.yml
          git commit -m "feat: register bounded binary export tool"
          git push origin HEAD:feat/binary-file-export
