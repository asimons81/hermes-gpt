name: G4-C Final Lint Fix

on:
  push:
    branches:
      - v0.8-fabric-g4c-artifacts-reconciliation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8-fabric-g4c-artifacts-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Fix final G4-C lint finding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fabric_artifacts.py')
          text = path.read_text()
          old = 'from pathlib import Path, PurePosixPath\nfrom typing import Any, Callable\n'
          new = 'from collections.abc import Callable\nfrom pathlib import Path, PurePosixPath\nfrom typing import Any\n'
          if old not in text:
              raise SystemExit('expected Callable import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m ruff check fabric_artifacts.py fabric_write_guard.py operator_fabric_g4c.py test_operator_fabric_g4c.py
          rm .github/workflows/g4c-final-lint-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(fabric): fix artifact helper imports'
          git push origin HEAD:v0.8-fabric-g4c-artifacts-reconciliation
