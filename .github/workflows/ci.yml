name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run runner regression tests
        run: >-
          python -m pytest -q
          test_operator_runners.py
          test_operator_fabric.py
          test_operator_fabric_adversarial.py
          test_operator_fabric_control.py
          test_operator_fabric_router.py
          test_operator_fabric_g4c.py
          test_operator_fabric_view.py
          test_ui_fabric.py
      - name: Run binary export regression tests
        run: python -m pytest -q test_operator_export.py test_server_export.py
      - name: Compile operator modules
        run: >-
          python -m py_compile
          server.py
          codex_core.py
          codex_mcp.py
          codex_config.py
          operator_codex.py
          operator_contract.py
          fabric_artifacts.py
          fabric_write_guard.py
          operator_fabric.py
          operator_fabric_control.py
          operator_fabric_router.py
          operator_fabric_g4c.py
          operator_fabric_view.py
          operator_fleet.py
          operator_runners.py
          operator_swarm.py
          operator_swarm_workflows.py
          operator_workspace.py
          operator_export.py
          updater.py
          operator_recovery.py
          operator_review.py
          operator_events.py
          operator_oauth.py
          token_store.py
          seams.py
          ui_api.py
          ui_fabric.py
      - name: Check whitespace
        run: git diff --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m ruff check
          fabric_artifacts.py fabric_write_guard.py
          operator_fabric.py operator_fabric_control.py operator_fabric_router.py operator_fabric_g4c.py operator_fabric_view.py
          test_operator_fabric.py test_operator_fabric_adversarial.py test_operator_fabric_control.py
          test_operator_fabric_router.py test_operator_fabric_g4c.py test_operator_fabric_view.py test_ui_fabric.py
          operator_runners.py test_operator_runners.py
          runner_confinement.py test_runner_confinement.py test_runner_confinement_policy.py
          operator_export.py test_operator_export.py test_server_export.py
          ui_api.py ui_fabric.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Secure MCP Tunnel PowerShell examples
        shell: powershell
        run: |
          $paths = @(
            'examples/start-openai-secure-mcp-tunnel.example.ps1',
            'examples/status-hermes-gpt.example.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

  # G4D_STABILIZE_BEGIN
  g4d-stabilize:
    if: github.event_name == 'pull_request' && github.head_ref == 'v0.8-fabric-g4d-flight-deck' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - name: Apply consolidated G4-D stabilization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('ui_fabric.py')
          text = ui.read_text()
          text = text.replace(
              'return op_mission._resolve_root(None)  # noqa: SLF001 - same-package UI adapter reuse',
              'return op_mission._resolve_root(None)',
          )
          text = text.replace(
              'if not isinstance(attempt_id, str) or not fabric._ID_RE.fullmatch(attempt_id):  # noqa: SLF001',
              'if not isinstance(attempt_id, str) or not fabric._ID_RE.fullmatch(attempt_id):',
          )
          ui.write_text(text)

          router = Path('operator_fabric_router.py')
          text = router.read_text()
          old = '''        "placed_contract_sha256": placed_sha256,\n        "selected": decision["selected"],\n        "created_at": datetime.now(timezone.utc).isoformat(),\n'''
          new = '''        "placed_contract_sha256": placed_sha256,\n        "mode": "auto",\n        "requirements": decision.get("requirements") or {},\n        "preferences": decision.get("preferences") or {},\n        "selected": decision["selected"],\n        "candidates": decision.get("candidates") or [],\n        "created_at": datetime.now(timezone.utc).isoformat(),\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '"candidates": decision.get("candidates") or []' not in text:
              raise SystemExit('router receipt block not found')
          router.write_text(text)

          package = Path('web/package.json')
          text = package.read_text()
          old = '"@vitejs/plugin-react": "^4.3.1"'
          new = '"@vitejs/plugin-react": "^6.0.4"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('plugin-react dependency marker not found')
          package.write_text(text)
          PY
          rm -f .github/workflows/g4d-routing-receipt.yml
          python -m ruff check --fix \
            operator_fabric_router.py operator_fabric_view.py ui_fabric.py \
            test_operator_fabric_view.py test_ui_fabric.py
          python -m pytest -q \
            test_operator_fabric.py test_operator_fabric_router.py \
            test_operator_fabric_g4c.py test_operator_fabric_view.py test_ui_fabric.py
          cd web
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
          npm run build
          cd ..
      - name: Finalize stabilization commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          start = text.index('  # G4D_STABILIZE_BEGIN\n')
          end = text.index('  # G4D_STABILIZE_END\n') + len('  # G4D_STABILIZE_END\n')
          path.write_text(text[:start] + text[end:])
          PY
          python -m ruff check \
            operator_fabric_router.py operator_fabric_view.py ui_fabric.py \
            test_operator_fabric_view.py test_ui_fabric.py
          python -m py_compile operator_fabric_router.py operator_fabric_view.py ui_fabric.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(fabric): stabilize G4-D gate'
          git push origin HEAD:v0.8-fabric-g4d-flight-deck
  # G4D_STABILIZE_END

  build:
    needs: [test, lint, web, windows-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check package hygiene
        run: python tools/check_package_hygiene.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
