name: CI

# One CI run per branch: pull_request fires for the PR branch, and push
# covers only master (the merge destination). Without the branch filter
# every PR update fired the full matrix twice - once for the push, once
# for the pull_request event - doubling pool occupancy (U104).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Nightly: full matrix + compatibility lane, off-peak.
    - cron: "23 4 * * *"

# A newer run for the same branch supersedes and cancels the one in
# flight instead of stacking another full matrix onto the pool.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-leak:
    # Immutable pin for supply-chain integrity (repo is public with no branch protection).
    # Tracks codeo1io/.github@main; rotate deliberately:
    #   gh api repos/codeo1io/.github/commits/main --jq .sha   # review the commit, then update the ref below
    permissions:
      contents: read
      pull-requests: read  # gitleaks ScanPullRequest lists PR commits via the pulls API
    uses: codeo1io/.github/.github/workflows/private-leak-sentinel.yaml@fd802b9e9dfdf20beac23ab8ad519911119854dc  # runner-labels input + PR-scan perms + stale gitleaks.tmp cleanup (2026-10-16)

  test:
    # PR fast lane: on pull_request only python 3.11 runs, but BOTH SDK
    # lanes do — SDK majors differ in tool execution semantics (SDK 1 runs
    # sync tools on the event loop, SDK 2 offloads them to a thread), so a
    # PR must exercise both before merge. Push(master), nightly, and
    # dispatch additionally widen the python matrix and pin exact floors.
    # (History: with one self-hosted runner executing jobs serially, the
    # PR run previously queued every lane behind the others — run
    # 35148449897: 2h43m wall, lanes 400-940s each — hence the reduced
    # python axis.)
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.10", "3.11", "3.12"]') }}
        # Both SDK lanes run on EVERY event including the PR fast lane:
        # SDK majors differ in tool execution semantics (SDK 1 runs sync
        # tools on the event loop, SDK 2 offloads them to a thread), so a
        # PR must exercise both before merge (rm-036).
        sdk: ["mcp>=1.28.1,<2", "mcp>=2,<3"]
        # Exact pins run on the full matrix only (push(master)/nightly/
        # dispatch). Current upstream releases under test (research
        # 2026-09-20): mcp 1.30.0 and 2.2.0 shipped 2026-09-07; exact pins
        # keep them covered deliberately rather than incidentally via the
        # range lanes.
        include: >-
          ${{ github.event_name == 'pull_request' && fromJSON('[]')
          || fromJSON('[{"python": "3.10", "sdk": "mcp==1.28.1"}, {"python": "3.10", "sdk": "mcp==2.0.0"}, {"python": "3.10", "sdk": "mcp==1.30.0"}, {"python": "3.10", "sdk": "mcp==2.2.0"}]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "${{ matrix.sdk }}"
      - name: Run full test suite
        env:
          HERMES_HTTP_TEST: "1"
        run: python -m pytest -q
      - name: Run runner regression tests
        run: >-
          python -m pytest -q
          test_operator_runners.py
          test_operator_fabric.py
          test_operator_fabric_adversarial.py
          test_operator_fabric_control.py
          test_operator_fabric_router.py
          test_operator_fabric_g4c.py
          test_operator_fabric_view.py
          test_operator_fabric_integration.py
          test_ui_fabric.py
      - name: Run binary export regression tests
        run: python -m pytest -q test_operator_export.py test_server_export.py
      - name: Compile operator modules
        run: >-
          python -m py_compile
          server.py
          codex_core.py
          codex_mcp.py
          mcp_compat.py
          codex_config.py
          operator_codex.py
          operator_contract.py
          fabric_artifacts.py
          fabric_write_guard.py
          operator_fabric.py
          operator_fabric_control.py
          operator_fabric_router.py
          operator_fabric_g4c.py
          operator_fabric_view.py
          operator_fleet.py
          operator_runners.py
          operator_swarm.py
          operator_swarm_workflows.py
          operator_workspace.py
          operator_export.py
          updater.py
          operator_recovery.py
          operator_review.py
          operator_events.py
          operator_oauth.py
          token_store.py
          seams.py
          ui_api.py
          ui_fabric.py
      - name: Check whitespace
        run: git diff --check

  agent-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]" httpx
      - name: Install the Hermes Agent runtime used by the loader
        run: python -m pip install -e hermes-agent-src
      - name: Prove the real Agent loader is importable
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent-src
          PYTHONPATH: ${{ github.workspace }}/hermes-agent-src
        run: >-
          python -c "import operator_skill_resolution as r;
          assert r._agent_modules() is not None, 'Hermes Agent loader missing'"
      - name: Run skill-resolution tests against the real Agent loader
        env:
          HERMES_HTTP_TEST: "1"
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent-src
          PYTHONPATH: ${{ github.workspace }}/hermes-agent-src
          HERMES_GPT_REQUIRE_AGENT_LOADER: "1"
        run: python -m pytest -q test_operator_skill_resolution.py

  compatibility:
    # Full-matrix lane: push(master) + nightly only, never the PR fast path.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Prove v0.7 local-only contracts, swarms, and runners remain unchanged
        run: >-
          python -m pytest -q
          test_operator_contract.py
          test_operator_swarm.py
          test_operator_runners.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      # Repo-wide gate (rm-017): previously a hand-maintained file list that
      # silently missed new modules; the whole tree is lint-clean now.
      - run: python -m ruff check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # No `cache: npm` — self-hosted runner, ~/.npm persists locally.
          # The actions cache round-trip measured 820s (run 35150442933,
          # Post setup-node step) against a 7s warm npm ci.
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flight-deck
          path: web/dist/

  windows-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Secure MCP Tunnel PowerShell examples
        shell: powershell
        run: |
          $paths = @(
            'examples/start-openai-secure-mcp-tunnel.example.ps1',
            'examples/status-hermes-gpt.example.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

  build:
    needs: [test, agent-loader, compatibility, lint, web, windows-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flight-deck
          path: web/dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check package content and private-file hygiene
        run: python tools/check_package_hygiene.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
