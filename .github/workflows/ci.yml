name: G5 Repair Runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'v0.8-fabric-g5-repair-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8-fabric-g5-repair-staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply reviewed fail-closed repair
        shell: bash
        run: |
          git show 0b5c9a84cd078bf839ff5f7b00c2941f72ef997f:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/fabric-g5-repair-staging.yml .fabric-g5-repair-trigger
          git apply --check .fabric-g5-repair.patch
          git apply .fabric-g5-repair.patch
      - name: Verify the three G5 repair regressions
        run: python -m pytest -q test_operator_fabric_g5_repair.py
      - name: Verify focused Fabric and G5 suites
        run: >-
          python -m pytest -q
          test_operator_fabric.py
          test_operator_fabric_adversarial.py
          test_operator_fabric_router.py
          test_operator_fabric_g4c.py
          test_operator_fabric_integration.py
          test_operator_contract.py
          test_operator_swarm.py
          test_operator_fabric_g5_repair.py
      - name: Lint repaired surfaces
        run: python -m ruff check operator_fabric.py operator_contract.py test_operator_fabric_g5_repair.py
      - name: Compile repaired runtime
        run: python -m py_compile operator_fabric.py operator_contract.py operator_fabric_g4c.py operator_fabric_router.py operator_swarm.py test_operator_fabric_g5_repair.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          rm .fabric-g5-repair.patch
          git config user.name "Hermes GPT repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(v0.8): close independent G5 authority findings"
          git push origin HEAD:v0.8-fabric-g5-repair-staging
