name: PR64 Python 3.10 compatibility

on:
  push:
    branches:
      - fix/pr63-remediation
    paths:
      - scripts/fix_pr64_py310.py
      - .github/workflows/pr64-py310-compat.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply compatibility fixes
        run: python scripts/fix_pr64_py310.py

      - name: Compile changed modules on Python 3.10
        run: |
          python -m py_compile \
            oauth_auth.py \
            operator_controller.py \
            operator_mission_plan.py \
            operator_mission_ledger.py \
            test_codex_pr63_remediation.py \
            test_operator_mission_ledger.py

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused tests on Python 3.10
        run: |
          python -m pytest \
            test_codex_pr63_remediation.py \
            test_operator_mission_ledger.py \
            test_operator_mission_plan.py \
            test_operator_controller.py \
            test_token_store.py

      - name: Run full suite on Python 3.10
        run: python -m pytest

      - name: Remove temporary compatibility machinery
        run: |
          rm -f scripts/fix_pr64_py310.py
          rm -f .github/workflows/pr64-py310-compat.yml

      - name: Commit verified compatibility fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve Python 3.10 compatibility in PR #64'
            git push origin HEAD:fix/pr63-remediation
          fi
