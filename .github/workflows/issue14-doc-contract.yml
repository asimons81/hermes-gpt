name: Issue 14 documentation contract finalizer

on:
  push:
    branches:
      - feat/binary-file-export

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/binary-file-export
          fetch-depth: 0

      - name: Apply exact guarded documentation and regression patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"guard failed for {path}: expected one marker, got {count}: {old[:120]!r}"
                  )
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "| `workspace` | scoped workspace writes/tests, gateway restart, Codex jobs, contract/swarm dispatch |",
              "| `workspace` | scoped workspace reads/writes/tests, bounded binary export, gateway restart, Codex jobs, contract/swarm dispatch |",
          )
          replace_once(
              "README.md",
              "See [docs/operator-mode.md](docs/operator-mode.md) for the complete policy model and exact gates.\n",
              "`hermes_export_file(path)` is a workspace-authorized, read-only transfer surface for existing local binary files. It requires a non-empty `HERMES_GPT_OPERATOR_ALLOWED_PATHS`, preserves the denied-secret-path policy, defaults to a 4 MiB cap with a 16 MiB hard ceiling via `HERMES_GPT_EXPORT_MAX_BYTES`, and returns bytes only as an MCP embedded blob. `HERMES_GPT_EXPORT_ALLOWED_EXTENSIONS` can optionally narrow allowed suffixes. Whether a client renders that resource as a downloadable attachment is client-controlled. See [Binary file export](docs/file-export.md).\n\nSee [docs/operator-mode.md](docs/operator-mode.md) for the complete policy model and exact gates.\n",
          )

          replace_once(
              "docs/operator-mode.md",
              "| `workspace` | scoped workspace read/write/test, gateway restart, Codex jobs, contract/swarm dispatch |",
              "| `workspace` | scoped workspace read/write/test, bounded binary export, gateway restart, Codex jobs, contract/swarm dispatch |",
          )
          replace_once(
              "docs/operator-mode.md",
              "## Work Contracts\n",
              "## Binary file export (`hermes_export_file`)\n\n"
              "`hermes_export_file(path)` transfers one existing local file as an MCP-native embedded binary resource. It is read-only, but deliberately requires **workspace** authority because raw-byte transfer can disclose data even when nothing is mutated. A non-empty `HERMES_GPT_OPERATOR_ALLOWED_PATHS` is mandatory, the resolved path must remain under an approved root, and the normal denied secret/credential/vault/token path policy still applies. Owner Mode does not bypass those denied paths.\n\n"
              "The default maximum is 4 MiB. `HERMES_GPT_EXPORT_MAX_BYTES` may lower or raise that limit up to a hard 16 MiB ceiling. `HERMES_GPT_EXPORT_ALLOWED_EXTENSIONS` optionally narrows allowed suffixes. The response contains safe metadata plus `EmbeddedResource(BlobResourceContents)`; local absolute paths and base64 payloads are not copied into text or structured metadata. Client rendering is client-controlled, so Hermes GPT guarantees the MCP-native binary result rather than a particular save/download UI. See [Binary file export](file-export.md) for the full contract.\n\n"
              "## Work Contracts\n",
          )

          replace_once(
              "docs/mcp-compatibility.md",
              "## Version advertisement\n",
              "## Binary embedded tool results\n\n"
              "`hermes_export_file` returns a direct MCP `CallToolResult` containing safe structured metadata and `EmbeddedResource(BlobResourceContents)` for authorized file bytes. This uses the normal `tools/call` response content union; it is not a new transport and does not require a separate resource-read endpoint. The export surface requires Operator `workspace` authority plus a non-empty `HERMES_GPT_OPERATOR_ALLOWED_PATHS`; see [Binary file export](file-export.md) for confinement, size, extension, denied-path, and audit rules.\n\n"
              "The MCP specification leaves rendering of embedded resources to the client. Hermes GPT guarantees the protocol-native blob representation and does not claim that ChatGPT, Codex, or another client will always render it as a downloadable attachment. No text/base64 fallback is emitted.\n\n"
              "## Version advertisement\n",
          )

          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n\n",
              "## Unreleased\n\n"
              "- Added `hermes_export_file`, a workspace-authorized read-only binary transfer tool that returns MCP `EmbeddedResource(BlobResourceContents)` with mandatory allowed-path confinement, denied-secret-path enforcement, a 4 MiB default / 16 MiB hard size ceiling, optional extension allowlisting, safe audit metadata, and no base64 text fallback. Client attachment rendering remains client-controlled.\n",
          )

          replace_once(
              "test_operator_export.py",
              "def test_export_rejects_secret_path_even_under_allowed_root(monkeypatch, tmp_path) -> None:\n",
              "def test_export_rejects_symlink_escape_outside_allowed_root(monkeypatch, tmp_path) -> None:\n"
              "    allowed = tmp_path / \"allowed\"\n"
              "    allowed.mkdir()\n"
              "    outside = tmp_path / \"outside\"\n"
              "    outside.mkdir()\n"
              "    target = outside / \"report.pdf\"\n"
              "    target.write_bytes(b\"%PDF-outside\")\n"
              "    link = allowed / \"linked.pdf\"\n"
              "    try:\n"
              "        link.symlink_to(target)\n"
              "    except OSError:\n"
              "        import pytest\n"
              "        pytest.skip(\"symlink creation is not available in this test environment\")\n"
              "    _configure_workspace(monkeypatch, allowed)\n\n"
              "    result = export.hermes_export_file(str(link))\n\n"
              "    assert result.isError is True\n"
              "    assert not any(isinstance(item, EmbeddedResource) for item in result.content)\n"
              "    assert b\"%PDF-outside\" != b\"\" and \"%PDF-outside\" not in json.dumps(result.structuredContent)\n\n\n"
              "def test_export_rejects_secret_path_even_under_allowed_root(monkeypatch, tmp_path) -> None:\n",
          )

          replace_once(
              "test_export_docs.py",
              "    compatibility = _read(ROOT / \"docs\" / \"mcp-compatibility.md\")\n\n    for text in (readme, operator):\n",
              "    compatibility = _read(ROOT / \"docs\" / \"mcp-compatibility.md\")\n"
              "    guide = _read(ROOT / \"docs\" / \"file-export.md\")\n\n"
              "    for text in (readme, operator, guide):\n",
          )
          replace_once(
              "test_export_docs.py",
              "    assert \"operator_export\" in data[\"tool\"][\"setuptools\"][\"py-modules\"]\n",
              "    assert \"operator_export\" in data[\"tool\"][\"setuptools\"][\"py-modules\"]\n"
              "    assert \"docs/file-export.md\" in data[\"tool\"][\"setuptools\"][\"data-files\"][\"share/hermes-gpt/docs\"]\n",
          )

      - name: Verify final contract
        run: |
          python -m py_compile server.py operator_export.py
          python -m pytest -q test_operator_export.py test_server_export.py test_export_docs.py
          python -m ruff check operator_export.py test_operator_export.py test_server_export.py
          git diff --check

      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/issue14-doc-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/operator-mode.md docs/mcp-compatibility.md CHANGELOG.md test_operator_export.py test_export_docs.py .github/workflows/issue14-doc-contract.yml
          git commit -m "docs: lock binary export security and client contract"
          git push origin HEAD:feat/binary-file-export
