  <rect x="880" y="420" width="276" height="32" rx="4" fill="#0F1730" stroke="#2A3550"/>
  <text x="892" y="441" fill="#E6EDF7" font-size="11">14 artifact paths + test log</text>

  <rect x="880" y="468" width="276" height="36" rx="4" fill="#0F1730" stroke="#2A3550"/>
  <text x="892" y="490" fill="#FBBF24" font-size="11">DRY-RUN first ▾</text>
  <text x="880" y="508" fill="#FB7185" font-size="10">self-review rejected · reviewer ≠ assignee enforced</text>

