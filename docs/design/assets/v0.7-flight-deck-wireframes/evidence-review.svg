  <rect x="204" y="540" width="972" height="184" rx="6" fill="#131A2E" stroke="#2A3550"/>
  <text x="224" y="564" fill="#E6EDF7" font-size="13" font-weight="700">Review flow (interaction spec)</text>
  <text x="224" y="588" fill="#8B98B8" font-size="11">1 → 2 → 3 → 4 (owner confirm) → hermes_contract_validate</text>
  <rect x="224" y="604" width="170" height="44" rx="4" fill="#0F1730" stroke="#2A3550"/>
