  <text x="880" y="350" fill="#8B98B8" font-size="11">verdict</text>
  <rect x="880" y="360" width="276" height="32" rx="4" fill="#0F1730" stroke="#2A3550"/>
  <text x="892" y="381" fill="#E6EDF7" font-size="11">SATISFIED ▾</text>

