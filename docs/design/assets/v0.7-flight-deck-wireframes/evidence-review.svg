  <text x="236" y="638" fill="#5B6A8F" font-size="10">read-only surfaces</text>
  <polygon points="400,626 416,614 416,638" fill="#2A3550"/>
  <rect x="424" y="604" width="170" height="44" rx="4" fill="#0F1730" stroke="#2A3550"/>
  <text x="436" y="622" fill="#8B98B8" font-size="10">2 dry-run accept</text>
  <text x="436" y="638" fill="#5B6A8F" font-size="10">no mutation</text>
  <polygon points="600,626 616,614 616,638" fill="#2A3550"/>
  <rect x="624" y="604" width="170" height="44" rx="4" fill="#0F1730" stroke="#2A3550"/>
  <text x="636" y="622" fill="#8B98B8" font-size="10">3 confirm</text>
  <text x="636" y="638" fill="#5B6A8F" font-size="10">owner ack required</text>
  <polygon points="800,626 816,614 816,638" fill="#2A3550"/>
  <rect x="824" y="604" width="180" height="44" rx="4" fill="#0F1730" stroke="#A78BFA"/>
  <text x="836" y="622" fill="#A78BFA" font-size="10">4 record written</text>
  <text x="836" y="638" fill="#5B6A8F" font-size="10">audited · JSONL append</text>
  <text x="224" y="676" fill="#8B98B8" font-size="11">acceptance record: record_id, contract_sha256, reviewer (distinct), verdict, evidence_refs, created_at — never raw prompts.</text>
  <text x="224" y="696" fill="#8B98B8" font-size="11">retention aligns with contract records · legal review of 30d window (open question).</text>

  <rect x="0" y="740" width="1200" height="40" fill="#0D1428"/>
  <rect x="0" y="740" width="1200" height="1" fill="#2A3550"/>
  <text x="24" y="764" fill="#5B6A8F" font-size="10">D3-A owner-gated writer · sources: contract_status, events, review-evidence store · UI calls gated hermes_review_accept only</text>
</svg>
