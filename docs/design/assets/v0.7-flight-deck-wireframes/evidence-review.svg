  <text x="900" y="104" fill="#8B98B8" font-size="11">source: hermes_contract_status</text>
  <text x="900" y="122" fill="#8B98B8" font-size="11">validator: observed-state</text>

  <!-- Evidence check -->
  <rect x="204" y="216" width="640" height="308" rx="6" fill="#131A2E" stroke="#2A3550"/>
  <text x="224" y="240" fill="#E6EDF7" font-size="13" font-weight="700">Observed evidence</text>
