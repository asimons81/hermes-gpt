  <text x="16" y="90" fill="#8B98B8" font-size="12">OVERVIEW</text>
  <text x="16" y="118" fill="#8B98B8" font-size="12">TASK MONITOR</text>
  <text x="16" y="146" fill="#8B98B8" font-size="12">EVENT HISTORY</text>
  <text x="16" y="174" fill="#22D3EE" font-size="12" font-weight="700">▸ EVIDENCE REVIEW</text>
  <text x="16" y="202" fill="#8B98B8" font-size="12">AUTHORITY</text>

  <!-- Contract under review -->
  <rect x="204" y="80" width="972" height="120" rx="6" fill="#131A2E" stroke="#2A3550"/>
  <text x="224" y="104" fill="#E6EDF7" font-size="14" font-weight="700">ctr-3c01 · work-contract/v1 · awaiting review</text>
  <text x="224" y="126" fill="#8B98B8" font-size="11">task_id rel-2026-08 · objective: produce verifiable v0.7 release package · scope: /home/tony/hermes-gpt</text>
  <text x="224" y="144" fill="#8B98B8" font-size="11">forbidden_actions: publish, secret access · expected_artifacts: docs, tests, release notes</text>
  <rect x="224" y="156" width="110" height="24" rx="3" fill="#A78BFA" opacity="0.15"/>
  <text x="234" y="172" fill="#A78BFA" font-size="10" font-weight="700">NOT_SATISFIED</text>
